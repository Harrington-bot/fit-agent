name: release-validate

# This workflow intentionally NEVER publishes packages or GitHub releases.
# It builds release-ready archives for a maintainer to inspect/download.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache: true }
      - name: Verify source
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-snapshot}"
          go build -trimpath -ldflags "-s -w -X github.com/jogvan-k/fit-agent/internal/cli.Version=${VERSION}" -o "dist/fit-agent${EXT}" ./cmd/fit-agent
          (cd dist && sha256sum "fit-agent${EXT}" > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: fit-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

# TODO: A future explicitly approved publishing workflow may consume these
# artifacts. Keep credentials and release-creation actions out of this file.
