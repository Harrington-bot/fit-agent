name: release

# Builds standalone binaries for manual download. This workflow never publishes
# FitAgent to a package manager; GitHub Releases are the distribution channel.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: '', archive: tar.gz }
          - { goos: linux, goarch: arm64, ext: '', archive: tar.gz }
          - { goos: darwin, goarch: arm64, ext: '', archive: tar.gz }
          - { goos: windows, goarch: amd64, ext: .exe, archive: zip }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache: true }
      - name: Verify source
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...
      - name: Build downloadable archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-snapshot}"
          NAME="fit-agent_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p dist/package
          go build -trimpath -ldflags "-s -w -X github.com/jogvan-k/fit-agent/internal/cli.Version=${VERSION}" -o "dist/package/fit-agent${EXT}" ./cmd/fit-agent
          cp README.md LICENSE dist/package/
          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist/package && zip -q "../${NAME}.zip" fit-agent.exe README.md LICENSE)
          else
            tar -C dist/package -czf "dist/${NAME}.tar.gz" fit-agent README.md LICENSE
          fi
          rm -rf dist/package
      - uses: actions/upload-artifact@v4
        with:
          name: fit-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: publish GitHub Release downloads
    needs: package
    # Manual runs validate artifacts only; version tags create the public GitHub
    # Release and attach the binaries below. No package registry is contacted.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fit-agent-*
          merge-multiple: true
          path: release
      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release and attach downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --title "FitAgent $TAG" \
            --generate-notes
